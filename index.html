<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinharia Agnello</title>
    <link rel="stylesheet" href="./src/css/style.css">
</head>
<body>
    <header class="hero-header">
        <h1>Bem-vindo à Vinharia Agnello!</h1>
    </header>

    <main class="actions-panel">
        <button class="wine-button primary add-button" onclick="cadastrarVinho()">Cadastre já o seu vinho!</button>
        <button class="wine-button list-button" onclick="listarVinhos()">Listar os vinhos</button>
        <button class="wine-button stock-button" onclick="verificarEstoque()">Verificar o estoque</button>
    </main>

    <section class="status-panel" aria-label="Resumo do estoque">
        <p id="contadorVinhos">Vinhos cadastrados: 0</p>
        <p id="vinhoBaixo">Vinhos com estoque baixo: 0</p>
        <p id="vinhoAntigo">Vinho mais antigo: </p>
    </section>

    <script src="./src/js/script.js"></script>
</body>
</html>
